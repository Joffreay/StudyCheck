services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studycheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-studycheck}
    volumes:
      - studycheck_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studycheck} -d ${POSTGRES_DB:-studycheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studycheck}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studycheck}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requis}
      READER1_EMAIL: ${READER1_EMAIL:-lecteur1@studycheck.local}
      READER1_PASSWORD: ${READER1_PASSWORD:?READER1_PASSWORD requis}
      READER2_EMAIL: ${READER2_EMAIL:-lecteur2@studycheck.local}
      READER2_PASSWORD: ${READER2_PASSWORD:?READER2_PASSWORD requis}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  studycheck_pg:
