services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studycheck
      POSTGRES_PASSWORD: studycheck
      POSTGRES_DB: studycheck
    ports:
      - "5433:5432"
    volumes:
      - studycheck_pg:/var/lib/postgresql/data

volumes:
  studycheck_pg:
